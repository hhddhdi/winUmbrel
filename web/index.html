<!DOCTYPE html>
<html>
<head>
  <title>Windows VM Launcher</title>
  <!-- Google Fonts: OCR A (via CDN) -->
  <link href="https://fonts.cdnfonts.com/css/ocr-a-std" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #18191a 0%, #232526 100%);
      min-height: 100vh;
      font-family: 'OCR A Std', 'Consolas', 'monospace', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .container {
      background: rgba(20,20,20,0.92);
      box-shadow: 0 8px 32px 0 rgba(10, 15, 40, 0.55);
      border-radius: 24px;
      padding: 40px 32px 32px 32px;
      max-width: 400px;
      width: 100%;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(60,60,60,0.28);
    }
    h2 {
      color: #e0e0e0;
      text-align: center;
      margin-bottom: 28px;
      font-size: 2rem;
      letter-spacing: 2px;
      font-family: 'OCR A Std', 'Consolas', 'monospace', Arial, sans-serif;
      text-shadow: 0 2px 8px #000a;
    }
    form label {
      color: #b0b0b0;
      font-size: 1.05rem;
      margin-bottom: 6px;
      display: block;
      font-family: 'OCR A Std', 'Consolas', 'monospace', Arial, sans-serif;
      letter-spacing: 1px;
    }
    form select, 
    form input[type="number"] {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      margin-bottom: 18px;
      border: none;
      border-radius: 12px;
      background: rgba(30,32,36,0.92);
      color: #e0e0e0;
      font-size: 1rem;
      font-family: 'OCR A Std', 'Consolas', 'monospace', Arial, sans-serif;
      box-shadow: 0 2px 8px #0004;
      outline: none;
      transition: box-shadow 0.2s, background 0.2s, color 0.2s;
    }
    form select:focus, 
    form input[type="number"]:focus {
      background: rgba(40,44,52,0.98);
      color: #fff;
      box-shadow: 0 4px 16px #0072ff33;
    }
    form input[type="submit"] {
      width: 100%;
      padding: 14px 0;
      background: linear-gradient(90deg, #003366 0%, #0055aa 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-family: 'OCR A Std', 'Consolas', 'monospace', Arial, sans-serif;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 4px 16px #00336666;
      margin-top: 10px;
      transition: background 0.2s, box-shadow 0.2s;
    }
    form input[type="submit"]:hover {
      background: linear-gradient(90deg, #0055aa 0%, #003366 100%);
      box-shadow: 0 6px 24px #0055aa77;
    }
    /* Custom scrollbar for select */
    select {
      scrollbar-width: thin;
      scrollbar-color: #0055aa #18191a;
    }
    ::-webkit-scrollbar {
      width: 8px;
      background: #18191a;
    }
    ::-webkit-scrollbar-thumb {
      background: #0055aa;
      border-radius: 8px;
    }
    /* Make all form controls the same width visually */
    form select,
    form input[type="number"] {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Escolher configuração da VM</h2>
    <form action="/start" method="post" autocomplete="off">
      <label for="version">Versão do Windows:</label>
      <select name="version" id="version" required>
        <option value="11">Windows 11 Pro (5.4 GB)</option>
        <option value="11l">Windows 11 LTSC (4.7 GB)</option>
        <option value="11e">Windows 11 Enterprise (4.0 GB)</option>
        <option value="10">Windows 10 Pro (5.7 GB)</option>
        <option value="10l">Windows 10 LTSC (4.6 GB)</option>
        <option value="10e">Windows 10 Enterprise (5.2 GB)</option>
        <option value="8e">Windows 8.1 Enterprise (3.7 GB)</option>
        <option value="7u">Windows 7 Ultimate (3.1 GB)</option>
        <option value="vu">Vista Ultimate (3.0 GB)</option>
        <option value="xp">XP Pro (0.6 GB)</option>
        <option value="2k">2000 Pro (0.4 GB)</option>
        <option value="2025">Server 2025 (5.6 GB)</option>
        <option value="2022">Server 2022 (4.7 GB)</option>
        <option value="2019">Server 2019 (5.3 GB)</option>
        <option value="2016">Server 2016 (6.5 GB)</option>
        <option value="2012">Server 2012 (4.3 GB)</option>
        <option value="2008">Server 2008 (3.0 GB)</option>
        <option value="2003">Server 2003 (0.6 GB)</option>
      </select>

      <label for="ram">RAM (em MB):</label>
      <input type="number" name="ram" id="ram" min="512" max="8192" value="2048" required>

      <label for="cpu">CPU Cores:</label>
      <input type="number" name="cpu" id="cpu" min="1" max="8" value="2" required>

      <label for="disk">Armazenamento (em GB):</label>
      <input type="number" name="disk" id="disk" min="10" max="100" value="20" required>

      <input type="submit" value="Iniciar Windows">
    </form>
  </div>
</body>
</html>
