version: "3.7"

services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "${WIN_VERSION}"
      RAM_SIZE: "${RAM_SIZE}"
      CPU_CORES: "${CPU_CORES}"
      DISK_SIZE: "${DISK_SIZE}"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./windows:/storage/shared/
    restart: always
    stop_grace_period: 2m

  config-ui:
    build: ./web
    container_name: config-ui
    ports:
      - "8010:80"
    volumes:
      - ./config:/app/config
    restart: unless-stopped
